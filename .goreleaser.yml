version: 2

builds:
  - id: playwright-exporter
    binary: playwright-exporter
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X main.version={{ .Version }}

archives:
  - id: default
    ids:
      - playwright-exporter
    formats:
      - tar.gz
    files:
      - none*
    name_template: "playwright-exporter_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  - id: archlinux
    ids:
      - playwright-exporter
    formats:
      - tar.zst
    files:
      - none*
    name_template: "playwright-exporter_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: packages
    ids:
      - playwright-exporter
    package_name: playwright-exporter
    homepage: https://github.com/maravexa/playwright-exporter
    maintainer: "maravexa <me@maravexa.com>"
    description: "Prometheus exporter that runs Playwright test suites on independent schedules for synthetic monitoring"
    license: MIT
    formats:
      - deb
      - rpm

    contents:
      - src: config.example.yaml
        dst: /etc/playwright-exporter/config.yaml
        type: config

      - src: playwright-exporter.service
        dst: /usr/lib/systemd/system/playwright-exporter.service

      - dst: /etc/playwright-exporter
        type: dir
        file_info:
          mode: 0755
          owner: root
          group: root

      # Runtime/project directories are created only if missing by postinstall.
      # Do not declare ownership here: package upgrades must preserve existing projects.
      - src: scripts/playwright-exporter-setup.sh
        dst: /usr/local/bin/playwright-exporter-setup
        file_info:
          mode: 0755

      - src: runtime/package.json
        dst: /usr/share/playwright-exporter/runtime/package.json
        file_info:
          mode: 0644
          owner: root
          group: root

      - src: runtime/package-lock.json
        dst: /usr/share/playwright-exporter/runtime/package-lock.json
        file_info:
          mode: 0644
          owner: root
          group: root

      - src: scripts/runtime-policy.sh
        dst: /usr/share/playwright-exporter/runtime/runtime-policy.sh
        file_info:
          mode: 0644
          owner: root
          group: root

    scripts:
      postinstall: scripts/postinstall.sh
      preremove: scripts/preremove.sh

    overrides:
      deb:
        recommends:
          - chromium
      rpm:
        recommends:
          - chromium
