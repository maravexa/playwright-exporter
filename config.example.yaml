listen_address: ":9115"
# Opt in only with exactly one schedule and a separately verified whole-service
# cleanup/restart boundary. This is not an untrusted-code sandbox.
restart_on_run_failure: false
# Linux-only per-run PID/user namespaces; requires reviewed host policy.
# Failure to create namespaces fails the run. No unisolated fallback.
isolate_process_tree: false

schedules:
  - name: site1
    interval: 10m
    timeout: 8m
    playwright_dir: /opt/playwright-tests/site1
    command: "./node_modules/.bin/playwright test --reporter=json"
    labels:
      site: site1
      tier: production

  - name: site2
    interval: 5m
    timeout: 4m
    playwright_dir: /opt/playwright-tests/site2
    command: "./node_modules/.bin/playwright test --reporter=json"
    labels:
      site: site2
      tier: production

  - name: internal_tools
    interval: 12h
    timeout: 10m
    playwright_dir: /opt/playwright-tests/internal_12h
    command: "./node_modules/.bin/playwright test --reporter=json"
    labels:
      category: internal
      tier: infrastructure
