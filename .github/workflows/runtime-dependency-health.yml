name: Runtime dependency health

on:
  schedule:
    - cron: '29 6 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - runtime/package.json
      - runtime/package-lock.json
      - .github/dependabot.yml
      - .github/workflows/runtime-dependency-health.yml

permissions:
  contents: read

jobs:
  runtime-advisories:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Audit public runtime lockfile without installing or fixing packages
        run: npm audit --prefix runtime --package-lock-only --ignore-scripts --audit-level=high --registry=https://registry.npmjs.org
