version: "2"
run:
  timeout: 5m
linters:
  enable:
    - goconst
    - gosec
    - misspell
    - prealloc
    - unparam
  settings:
    gosec:
      excludes:
        - G204 # Subprocess execution is core functionality
        - G304 # Config path comes from operator-controlled CLI flag
    govet:
      enable-all: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
